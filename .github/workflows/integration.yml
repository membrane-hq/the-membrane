name: Pilot integration (disposable)
# Manual, disposable end-to-end check of the pilot compose stack on a
# GitHub-hosted runner (free for this public repo on standard runners).
# No user host, no credentials, no publishing: keys are generated in the
# runner and discarded; images are built locally and never pushed.
# Stub mode exercises the authorization path ONLY (mock model replies) -
# a green stub run says nothing about real model serving. Real mode
# downloads the 0.5B GGUF from Hugging Face and tests through the model.
# Every green run ends by writing, signing, and verifying a run manifest
# over the evidence bundle; the bundle itself stays on the disposable runner.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'stub (auth path only) or real (downloads the 0.5B GGUF)'
        required: true
        default: 'stub'
        type: choice
        options: ['stub', 'real']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI and helper
        run: cargo build --locked -p membrane-cli --bin membrane --example operator-request --example run-manifest
      - name: Build gate image locally (as the compose file expects)
        run: docker build -f deploy/gate/Dockerfile -t ghcr.io/membrane-hq/the-membrane/membrane-gate:edge .
      - name: Generate ephemeral keys and grant
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo run --locked -q -p membrane-cli --example operator-request -- setup "$RUNNER_TEMP/pilot"
          sed -i 's#http://127.0.0.1:8080#http://llama:8080#' "$RUNNER_TEMP/pilot/registry.yaml"
          export NOSTR_NSEC_FILE="$RUNNER_TEMP/pilot/operator.nsec"
          membrane iac issue --caller-pubkey "$(jq -r .caller_pubkey "$RUNNER_TEMP/pilot/keys.json")" \
            --scope-id pilot-scope --model sha256:demo-model --ttl-secs 900 --out "$RUNNER_TEMP/pilot/iac.json"
          mkdir -p deploy/pilot/config
          cp "$RUNNER_TEMP/pilot/registry.yaml" "$RUNNER_TEMP/pilot/iac.json" "$RUNNER_TEMP/pilot/operator.nsec" deploy/pilot/config/
          chmod 600 deploy/pilot/config/operator.nsec
      - name: Start local throwaway relay
        # Bind only the docker bridge gateway address: reachable from the
        # gate container via host-gateway and from the runner host for the
        # evidence export, but not from outside the runner VM. A
        # loopback-only publish is unreachable from containers (docker DNAT
        # for a loopback-bound publish matches only loopback destinations,
        # so every gate publish was silently dropped and the export read
        # an empty relay); 0.0.0.0 would expose the relay publicly.
        run: |
          GW=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "RELAY_IP=$GW" >> "$GITHUB_ENV"
          docker run --rm -d --name membrane-relay -p "$GW:7778:8080" scsibug/nostr-rs-relay:0.10.0
      - name: Fetch model (real mode)
        if: inputs.model == 'real'
        id: fetch-model
        run: |
          docker volume create membrane-pilot-llama-models
          docker run --rm --user 0 -v membrane-pilot-llama-models:/models curlimages/curl:8.23.0 \
            -fsSL -o /models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          # The resolve URL redirects; without -L curl saves the 302 body
          # (1118 bytes of HTML) and llama-server cannot load it. Fail on
          # anything under 100MB so a bad fetch stops the run here.
          docker run --rm --user 0 -v membrane-pilot-llama-models:/models alpine:3 \
            sh -ec 'test $(stat -c %s /models/qwen2.5-0.5b-instruct-q4_k_m.gguf) -gt 104857600 \
              && [ "$(head -c 4 /models/qwen2.5-0.5b-instruct-q4_k_m.gguf)" = GGUF ]'
          # Record the fetched model's identity for the run manifest.
          model_sha256=$(docker run --rm --user 0 -v membrane-pilot-llama-models:/models alpine:3 \
            sha256sum /models/qwen2.5-0.5b-instruct-q4_k_m.gguf | cut -d' ' -f1)
          model_bytes=$(docker run --rm --user 0 -v membrane-pilot-llama-models:/models alpine:3 \
            stat -c %s /models/qwen2.5-0.5b-instruct-q4_k_m.gguf)
          echo "model_sha256=$model_sha256" >> "$GITHUB_OUTPUT"
          echo "model_bytes=$model_bytes" >> "$GITHUB_OUTPUT"
      - name: Stub override (stub mode replaces the model service, enables mock replies)
        if: inputs.model == 'stub'
        run: |
          printf '%s\n' \
            'services:' \
            '  llama:' \
            '    image: alpine' \
            '    entrypoint: ["sh", "-c", "sleep infinity"]' \
            '    command: []' \
            '    volumes: []' \
            '    deploy: {}' \
            '  gate:' \
            '    environment:' \
            '      MEMBRANE_DEV_MOCK_MODEL: "1"' \
            > deploy/pilot/docker-compose.stub.yml
      - name: Start the pilot stack
        run: |
          cd deploy/pilot
          EXTRA=""
          [ "${{ inputs.model }}" = "stub" ] && EXTRA="-f docker-compose.stub.yml"
          MEMBRANE_RELAY_URL=ws://host.docker.internal:7778 docker compose -f docker-compose.yml $EXTRA up -d
      - name: Wait for gate readiness (status ok, journal healthy)
        run: |
          # /health returns 200 with a status field: ok|degraded, covering
          # journal availability, journal dispatch blockage and router
          # staleness. Fresh-boot semantics verified in code: router staleness
          # is false before any router CP exists (session.rs), and a fresh
          # operation dir has no unresolved operations, so a healthy pilot
          # boot reaches status=ok. Gate on that; fail explicitly otherwise.
          body=""; ready=""
          for i in $(seq 1 90); do
            body=$(curl -fsS http://127.0.0.1:8787/health 2>/dev/null) &&               [ "$(echo "$body" | jq -r .status)" = "ok" ] && { ready=1; break; }
            sleep 2
          done
          echo "$body" | jq '{status, journal_available, journal_dispatch_blocked, router_stale, unresolved_operations}' || true
          [ "$ready" = 1 ] || { echo "FAIL: gate never reported status=ok"; exit 1; }
      - name: Wait for model server load (real mode)
        if: inputs.model == 'real'
        run: |
          # llama-server only starts listening after the model has loaded;
          # gate /health does not cover the model backend.
          cd deploy/pilot
          loaded=""
          for i in $(seq 1 60); do
            if docker compose logs llama 2>&1 | grep -q "listening on "; then
              loaded=1; break
            fi
            sleep 5
          done
          [ "$loaded" = 1 ] || { echo "FAIL: llama-server never reported listening"; docker compose logs --no-color llama | tail -50; exit 1; }
      - name: Authorized call returns 200, replay refused 403 with its denial reason
        id: auth-call
        run: |
          export PATH="$PWD/target/debug:$PATH"
          export NOSTR_NSEC_FILE="$RUNNER_TEMP/pilot/caller.nsec"
          echo '{"model":"sha256:demo-model","messages":[{"role":"user","content":"hi"}],"stream":false}' > "$RUNNER_TEMP/pilot/chat.json"
          cargo run --locked -q -p membrane-cli --example operator-request -- sign \
            http://127.0.0.1:8787 "$(jq -r .operator_pubkey "$RUNNER_TEMP/pilot/keys.json")" \
            "$RUNNER_TEMP/pilot/iac.json" /v1/chat/completions "$RUNNER_TEMP/pilot/chat.json" "$RUNNER_TEMP/pilot/request"
          send() { curl -s -o "$1" -w '%{http_code}' http://127.0.0.1:8787/v1/chat/completions \
            --header @"$RUNNER_TEMP/pilot/request/headers.txt" --data-binary @"$RUNNER_TEMP/pilot/request/body.json"; }
          first=$(send "$RUNNER_TEMP/pilot/first.json"); second=$(send "$RUNNER_TEMP/pilot/replay.json")
          echo "first=$first second=$second"
          { echo "first_code=$first"; echo "second_code=$second"; } >> "$GITHUB_OUTPUT"
          # Separate assertions: under bash -e, the left side of an && list
          # is exempt from errexit, so a failed first check short-circuits
          # and the line silently passes.
          [ "$first" = 200 ]
          [ "$second" = 403 ]
          # The reply must come from the mode's real backend: a stub reply
          # carries the mock marker; a real reply must not, and must carry
          # non-empty model content. A 200 alone proves neither.
          if [ "${{ inputs.model }}" = "real" ]; then
            jq -e '((.choices[0].message.content // "") | length > 0) and ((.choices[0].message.content // "") | contains("[membrane-mock]") | not)' \
              "$RUNNER_TEMP/pilot/first.json" > /dev/null \
              || { echo "FAIL: real-mode reply empty or came from the mock"; cat "$RUNNER_TEMP/pilot/first.json"; exit 1; }
          else
            jq -e '.choices[0].message.content | contains("[membrane-mock]")' \
              "$RUNNER_TEMP/pilot/first.json" > /dev/null \
              || { echo "FAIL: stub-mode reply missing the mock marker"; cat "$RUNNER_TEMP/pilot/first.json"; exit 1; }
          fi
          # The replay refusal must carry its reason, not a bare status.
          jq -e '.ok == false and .status == "blocked" and (.error.message | test("replay"))' \
            "$RUNNER_TEMP/pilot/replay.json" > /dev/null \
            || { echo "FAIL: replay 403 missing denial reason"; cat "$RUNNER_TEMP/pilot/replay.json"; exit 1; }
      - name: Invalid candidate registry is refused, live config byte-unchanged
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cd deploy/pilot
          cp config/registry.yaml "$RUNNER_TEMP/pilot/registry.before"
          printf '{{{ not a registry\n' > "$RUNNER_TEMP/pilot/bad.yaml"
          if membrane registry validate "$RUNNER_TEMP/pilot/bad.yaml"; then
            echo "FAIL: invalid registry validated"; exit 1
          fi
          if membrane registry apply "$RUNNER_TEMP/pilot/bad.yaml" --to config/registry.yaml; then
            echo "FAIL: invalid registry applied"; exit 1
          fi
          cmp "$RUNNER_TEMP/pilot/registry.before" config/registry.yaml \
            || { echo "FAIL: live registry changed by refused apply"; exit 1; }
      - name: Policy change via shipped apply - revoked caller is refused; evidence exports
        id: revocation
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cd deploy/pilot
          caller_pubkey="$(jq -r .caller_pubkey "$RUNNER_TEMP/pilot/keys.json")"
          cp config/registry.yaml "$RUNNER_TEMP/pilot/revoke.yaml"
          sed -i 's/revoked: false/revoked: true/' "$RUNNER_TEMP/pilot/revoke.yaml"
          grep -q 'revoked: true' "$RUNNER_TEMP/pilot/revoke.yaml" \
            || { echo "FAIL: revoke candidate did not flip the revoked flag"; exit 1; }
          membrane registry validate "$RUNNER_TEMP/pilot/revoke.yaml"
          membrane registry diff config/registry.yaml "$RUNNER_TEMP/pilot/revoke.yaml" | tee "$RUNNER_TEMP/pilot/diff.txt"
          # The review diff must name the identity being revoked and the flag change.
          grep -q "identity changed: $caller_pubkey" "$RUNNER_TEMP/pilot/diff.txt" \
            || { echo "FAIL: diff not bound to the revoked caller identity"; exit 1; }
          grep -q 'revoked: false -> true' "$RUNNER_TEMP/pilot/diff.txt" \
            || { echo "FAIL: diff missing the revoked flag change"; exit 1; }
          membrane registry apply "$RUNNER_TEMP/pilot/revoke.yaml" --to config/registry.yaml
          export NOSTR_NSEC_FILE="$RUNNER_TEMP/pilot/caller.nsec"
          cargo run --locked -q -p membrane-cli --example operator-request -- sign \
            http://127.0.0.1:8787 "$(jq -r .operator_pubkey "$RUNNER_TEMP/pilot/keys.json")" \
            "$RUNNER_TEMP/pilot/iac.json" /v1/chat/completions "$RUNNER_TEMP/pilot/chat.json" "$RUNNER_TEMP/pilot/request2"
          code=$(curl -s -o "$RUNNER_TEMP/pilot/revoked.json" -w '%{http_code}' http://127.0.0.1:8787/v1/chat/completions \
            --header @"$RUNNER_TEMP/pilot/request2/headers.txt" --data-binary @"$RUNNER_TEMP/pilot/request2/body.json")
          echo "post-revocation=$code"; [ "$code" = 403 ]
          # The revocation refusal must carry its reason, not a bare status.
          jq -e '.ok == false and .status == "blocked" and (.error.message | test("revoked"))' \
            "$RUNNER_TEMP/pilot/revoked.json" > /dev/null \
            || { echo "FAIL: revocation 403 missing denial reason"; cat "$RUNNER_TEMP/pilot/revoked.json"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pilot/bundle"
          MEMBRANE_RELAY_URL="ws://${RELAY_IP}:7778" membrane evidence export --format jsonl --since-secs 3600 \
            --out "$RUNNER_TEMP/pilot/bundle/evidence.jsonl" \
            --signed-events-out "$RUNNER_TEMP/pilot/bundle/signed-events.jsonl"
          lines=$(wc -l < "$RUNNER_TEMP/pilot/bundle/evidence.jsonl"); echo "evidence_lines=$lines"; [ "$lines" -ge 1 ]
          { echo "post_revocation_code=$code"; echo "evidence_lines=$lines"; } >> "$GITHUB_OUTPUT"
          # The revoked denial must appear as a blocked receipt correlated to
          # the pilot scope; the allowed call's receipts stay aggregate.
          jq -e 'select(.event_type == "blocked_action" and .scope_id == "pilot-scope" and ((.reason // "") | test("revoked")))' \
            "$RUNNER_TEMP/pilot/bundle/evidence.jsonl" > /dev/null \
            || { echo "FAIL: no scope-correlated revoked receipt in evidence export"; cat "$RUNNER_TEMP/pilot/bundle/evidence.jsonl"; exit 1; }
      - name: Write, sign, and verify the run manifest
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cd deploy/pilot
          B="$RUNNER_TEMP/pilot/bundle"
          cp config/registry.yaml "$B/registry.yaml"
          cp "$RUNNER_TEMP/pilot/iac.json" "$B/iac.json"
          operator_pubkey="$(jq -r .operator_pubkey "$RUNNER_TEMP/pilot/keys.json")"
          # Run scalars identify what ran, where, and from which commit.
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg model_input "${{ inputs.model }}" --arg runner "${{ runner.os }}" \
            '{repository:$repository, commit:$commit, run_id:$run_id, run_attempt:$run_attempt, model_input:$model_input, runner:$runner}' \
            > "$RUNNER_TEMP/pilot/run.json"
          # Inputs bind the exact code and images the run executed. The gate
          # image is built locally (image ID); pulled images are bound by
          # repo digest. The workflow file hash binds the driving steps.
          workflow_sha256=$(sha256sum "$GITHUB_WORKSPACE/.github/workflows/integration.yml" | cut -d' ' -f1)
          gate_image_id=$(docker image inspect ghcr.io/membrane-hq/the-membrane/membrane-gate:edge -f '{{.Id}}')
          relay_image=$(docker image inspect scsibug/nostr-rs-relay:0.10.0 -f '{{index .RepoDigests 0}}')
          if [ "${{ inputs.model }}" = "real" ]; then
            llama_image=$(docker image inspect ghcr.io/ggml-org/llama.cpp:server -f '{{index .RepoDigests 0}}')
            model_json=$(jq -n --arg file qwen2.5-0.5b-instruct-q4_k_m.gguf \
              --arg sha256 "${{ steps.fetch-model.outputs.model_sha256 }}" \
              --argjson bytes "${{ steps.fetch-model.outputs.model_bytes }}" \
              '{file:$file, sha256:$sha256, bytes:$bytes}')
          else
            llama_image=$(docker image inspect alpine -f '{{index .RepoDigests 0}}')
            model_json='{"mock": true}'
          fi
          jq -n --arg workflow_sha256 "$workflow_sha256" --arg gate_image_id "$gate_image_id" \
            --arg llama_image "$llama_image" --arg relay_image "$relay_image" --argjson model "$model_json" \
            '{workflow_sha256:$workflow_sha256, gate_image_id:$gate_image_id, llama_image:$llama_image, relay_image:$relay_image, model:$model}' \
            > "$RUNNER_TEMP/pilot/inputs.json"
          # Roles are named separately even when the pilot fills them with
          # one ephemeral operator key: the verifier checks each role on its
          # own, so a future split-key setup needs no manifest change.
          publishers=$(jq -R -s '[split("\n")[] | select(length > 0) | fromjson.subject_pubkey] | unique' "$B/signed-events.jsonl")
          jq -n --arg iac_issuer "$operator_pubkey" --arg signer "$operator_pubkey" --argjson pubs "$publishers" \
            '{iac_issuer_pubkey:$iac_issuer, receipt_publisher_pubkeys:$pubs, manifest_signer_pubkey:$signer}' \
            > "$RUNNER_TEMP/pilot/roles.json"
          jq -n --argjson authorized "${{ steps.auth-call.outputs.first_code }}" \
            --argjson replay "${{ steps.auth-call.outputs.second_code }}" \
            --argjson post_revocation "${{ steps.revocation.outputs.post_revocation_code }}" \
            --argjson evidence_lines "${{ steps.revocation.outputs.evidence_lines }}" \
            '{authorized_call_status:$authorized, replay_status:$replay, post_revocation_status:$post_revocation, evidence_lines:$evidence_lines}' \
            > "$RUNNER_TEMP/pilot/results.json"
          cargo run --locked -q -p membrane-cli --example run-manifest -- collect \
            --run-json "$RUNNER_TEMP/pilot/run.json" --roles-json "$RUNNER_TEMP/pilot/roles.json" \
            --inputs-json "$RUNNER_TEMP/pilot/inputs.json" --results-json "$RUNNER_TEMP/pilot/results.json" \
            --file "registry.yaml=$B/registry.yaml" --file "iac.json=$B/iac.json" \
            --file "evidence.jsonl=$B/evidence.jsonl" --file "signed-events.jsonl=$B/signed-events.jsonl" \
            --out "$B/run-manifest.json"
          export NOSTR_NSEC_FILE="$RUNNER_TEMP/pilot/operator.nsec"
          cargo run --locked -q -p membrane-cli --example run-manifest -- sign \
            --manifest "$B/run-manifest.json" --out "$B/run-manifest.signed.json"
          mv "$B/run-manifest.signed.json" "$B/run-manifest.json"
          cargo run --locked -q -p membrane-cli --example run-manifest -- verify \
            --manifest "$B/run-manifest.json" --bundle "$B" --signer-pubkey "$operator_pubkey"
          # The signed bundle stays on the disposable runner for now: where
          # durable bundles may live is a separate decision. The hash below
          # binds this run's log to the verified manifest.
          sha256sum "$B/run-manifest.json"
      - name: Collect logs on failure
        if: failure()
        # Redact bech32 secret keys (nsec1...) defensively; key material is
        # never logged by the gate, but logs leave the runner only redacted.
        run: |
          cd deploy/pilot
          docker compose logs --no-color 2>&1 | sed -E 's/nsec1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]+/[REDACTED]/g' > "$RUNNER_TEMP/pilot-logs.txt" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pilot-logs
          path: ${{ runner.temp }}/pilot-logs.txt
          retention-days: 7
