[workspace]
resolver = "2"
members = [
    "membrane-core",
    "membrane-gate",
    "membrane-cli",
    "membrane-dashboard",
    "membrane-advisor",
]
default-members = ["membrane-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/membrane-hq/the-membrane"
authors = ["Zorie R. Barber"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
nostr = "0.44.7"
nostr-sdk = "0.44"
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

membrane-core = { path = "membrane-core" }
membrane-gate = { path = "membrane-gate" }
