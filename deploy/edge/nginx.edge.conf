# Edge proxy for the required-path reference deployment. It is the only
# published route to the gate. A production edge identity layer (for example
# Cloudflare Access) additionally authenticates the caller here and issues
# the assertion the gate verifies; that authentication is intentionally not
# reimplemented in this repository.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://gate:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The gate's model proxy allows up to 120s upstream.
        proxy_read_timeout 130s;
    }
}
