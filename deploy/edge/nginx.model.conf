# Example protected backend for the required-path reference deployment.
# Stands in for a model API: answers only the chat-completions shape the
# gate proxies, with a marker showing the reply crossed gate -> backend.
server {
    listen 8080;
    server_name _;

    location = /v1/chat/completions {
        default_type application/json;
        return 200 '{"id":"edge-ref-upstream","object":"chat.completion","model":"sha256:demo-model","choices":[{"index":0,"message":{"role":"assistant","content":"[edge-ref] reached the model backend through the gate"},"finish_reason":"stop"}]}';
    }

    location / {
        return 404;
    }
}
