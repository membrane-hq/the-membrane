name: membrane-edge

# Required-path reference deployment: the gate, the model backend, the JWKS
# source and the relay sit on an internal network with no published ports and
# no internet egress. The only route to the gate is through the edge proxy,
# and the gate additionally refuses any production request that lacks a valid
# assertion from the pinned edge issuer (docs/edge-deployment.md). verify.sh
# checks that direct connections fail and both checks are enforced.
#
# MEMBRANE_GATE_IMAGE selects the exact image, as in deploy/pilot. Prereq:
# registry, IAC and operator key in ./config, generated by verify.sh or by
# hand with the CLI (docs/quickstart.md). test-keys/ holds a disposable edge
# signing key for this local deployment only; never reuse it anywhere real.

services:
  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - gate
    networks:
      - edge
      - internal
    volumes:
      - ./nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"

  gate:
    image: ${MEMBRANE_GATE_IMAGE:-membrane-gate:local}
    restart: unless-stopped
    depends_on:
      - model
      - jwks
      - relay
    networks:
      - internal
    environment:
      MEMBRANE_OPERATION_DIR: /state/tool-operations
      MEMBRANE_RELAY_URL: ws://relay:8080
      NOSTR_NSEC_FILE: /config/operator.nsec
      MEMBRANE_EDGE_AUTH_CONFIG: /edge/edge-auth.yaml
    volumes:
      # Directory mount, not single files: `membrane registry apply` installs
      # atomically by rename. Keep registry.yaml, iac.json and operator.nsec
      # in ./config.
      - ./config:/config:ro
      - ./edge-auth.yaml:/edge/edge-auth.yaml:ro
      - gate-state:/state
    command:
      - gate
      - start
      - --listen
      - "0.0.0.0:8787"
      - --registry
      - /config/registry.yaml
      - --iac
      - /config/iac.json
      - --relay
      - ws://relay:8080

  # Example protected backend: stands in for the model API. Reachable only
  # on the internal network; its canned reply carries a marker so a 200
  # shows the response really crossed gate -> backend.
  model:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./nginx.model.conf:/etc/nginx/conf.d/default.conf:ro

  # Local stand-in for the edge issuer's JWKS endpoint, on the stock image's
  # port 80. Production pins an HTTPS URL run by the edge identity layer.
  jwks:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./test-keys/jwks.json:/usr/share/nginx/html/jwks.json:ro

  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    restart: unless-stopped
    networks:
      - internal

  # Client standpoint for verify.sh: sits on the edge network only, holds no
  # credentials, and has no route to the gate or the model backend.
  agent:
    image: curlimages/curl:8.23.0
    networks:
      - edge
    entrypoint: ["sh", "-c", "sleep infinity"]

networks:
  edge:
  internal:
    internal: true

volumes:
  gate-state:
