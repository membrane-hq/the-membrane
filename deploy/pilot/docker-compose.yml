name: membrane-pilot

# Pilot: the tested gate image plus a local example model backend.
# MEMBRANE_GATE_IMAGE selects the exact image: take the digest-pinned
# reference (membrane-gate@sha256:...) from the signed run manifest of a
# green pilot run so what runs here is what was tested. The integration
# workflow sets it itself.
# Prereq: a registry and IAC for the caller, generated with the CLI
# (docs/quickstart.md, steps 1-3). Copy them into ./config as
# registry.yaml, iac.json and operator.nsec (mode 0600; the signing key
# loads from the file, never the environment).

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - llama-models:/models:ro
    command:
      - -m
      - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --threads
      - "4"
      - --ctx-size
      - "2048"
    deploy:
      resources:
        limits:
          memory: 3g

  gate:
    image: ${MEMBRANE_GATE_IMAGE:?Set MEMBRANE_GATE_IMAGE to the digest-pinned gate image reference from a signed pilot run manifest}
    restart: unless-stopped
    depends_on:
      - llama
    environment:
      MEMBRANE_OPERATION_DIR: /state/tool-operations
      MEMBRANE_RELAY_URL: ${MEMBRANE_RELAY_URL:-ws://host.docker.internal:7778}
      NOSTR_NSEC_FILE: /config/operator.nsec
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Directory mount, not single files: `membrane registry apply` installs
      # atomically by rename, and a rename inside a single-file bind mount
      # never reaches the container. Keep registry.yaml, iac.json and
      # operator.nsec in ./config.
      - ./config:/config:ro
      - gate-state:/state
    ports:
      - "127.0.0.1:8787:8787"
    command:
      - gate
      - start
      - --listen
      - "0.0.0.0:8787"
      - --registry
      - /config/registry.yaml
      - --iac
      - /config/iac.json
      - --relay
      - ${MEMBRANE_RELAY_URL:-ws://host.docker.internal:7778}

volumes:
  gate-state:
  llama-models:
    name: membrane-pilot-llama-models
