name: membrane

services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: membrane-llama
    restart: unless-stopped
    volumes:
      - llama-models:/models:ro
    command:
      - -m
      - /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --threads
      - "4"
      - --ctx-size
      - "2048"
    ports: []
    deploy:
      resources:
        limits:
          memory: 3g

  gate:
    image: ${MEMBRANE_GATE_IMAGE:-membrane-gate:local}
    container_name: membrane-gate
    restart: unless-stopped
    depends_on:
      - llama
    environment:
      MEMBRANE_OPERATION_DIR: /state/tool-operations
      MEMBRANE_RELAY_URL: ${MEMBRANE_RELAY_URL:-ws://host.docker.internal:7778}
      NOSTR_NSEC: ${NOSTR_NSEC:?NOSTR_NSEC required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./channel-registry.prod.yaml:/config/registry.yaml:ro
      - ./iac.prod.json:/config/iac.json:ro
      - gate-state:/state
    ports:
      - "127.0.0.1:8787:8787"
    command:
      - gate
      - start
      - --listen
      - "0.0.0.0:8787"
      - --registry
      - /config/registry.yaml
      - --iac
      - /config/iac.json
      - --relay
      - ${MEMBRANE_RELAY_URL:-ws://host.docker.internal:7778}

volumes:
  gate-state:
  llama-models:
    name: membrane-llama-models
